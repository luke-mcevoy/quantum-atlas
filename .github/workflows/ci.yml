name: CI

# Every push and PR: the data must validate, the published atlas must be a fresh verified build,
# no new unreviewed numbers may appear in prose, the app must typecheck/test/build, and the live
# UI must load and work in a real browser. Deploys to Fly from main only when all of that passes.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Validate research + verification files
        run: node scripts/validate.mjs
      - name: Official tutorials match their harness diffs
        run: node scripts/check-examples.mjs
      - name: Published atlas is a fresh, non-draft verified build
        run: node scripts/check-build-fresh.mjs
      - name: No new unquoted numbers in prose
        run: node scripts/audit-numbers.mjs --ci

  app:
    name: App (typecheck, unit tests, build, browser smoke)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: app/test-results, retention-days: 7 }

  examples:
    name: Examples (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: amazon-braket-sdk
          - sdk: pulser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/requirements/${{ matrix.sdk }}.txt
      - name: Install the pinned SDK
        run: python -m pip install -r examples/requirements/${{ matrix.sdk }}.txt
      - name: Run harnesses with networking blocked
        run: |
          set -uo pipefail
          sudo iptables-save > /tmp/iptables.before
          sudo ip6tables-save > /tmp/ip6tables.before
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
          sudo ip6tables -I OUTPUT 2 -j REJECT
          node scripts/run-examples.mjs --sdk "${{ matrix.sdk }}" --python python3 --out "examples/results.${{ matrix.sdk }}.json"
          status=$?
          sudo iptables-restore < /tmp/iptables.before || true
          sudo ip6tables-restore < /tmp/ip6tables.before || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-results-${{ matrix.sdk }}
          path: examples/results.${{ matrix.sdk }}.json
          retention-days: 14
          if-no-files-found: error

  example-results:
    name: Merge example results
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with:
          pattern: example-results-*
          merge-multiple: true
          path: examples/fragments
      - name: Merge per-SDK results and fail if any harness failed
        run: node scripts/run-examples.mjs --merge examples/fragments --out examples/results.json

  deploy:
    name: Deploy to Fly
    needs: [data, app, example-results]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (skipped unless the FLY_API_TOKEN secret is set)
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN not set; skipping deploy"; exit 0; fi
          flyctl deploy --remote-only
